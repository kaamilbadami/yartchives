name: Temporary coverage audit provider identity fix

on:
  push:
    branches:
      - fix/coverage-audit-provider-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply patch
        run: python tmp_apply_identity_fix.py
      - name: Validate
        run: |
          python -m unittest tests.test_coverage_audit -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/frontend-utils.test.cjs
          node tests/apply-next.test.cjs
          node tests/apply-next-readiness.test.cjs
          node tests/apply-next-competition.test.cjs
          node tests/apply-next-ui.test.cjs
          node tests/apply-next-profile-setup.test.cjs
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8
          git diff --check
      - name: Commit fix and remove temporary helpers
        run: |
          git config user.name 'yartchives-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-coverage-audit-identity-fix.yml tmp_apply_identity_fix.py
          git add scripts/coverage_audit.py tests/test_coverage_audit.py
          git commit -m 'Fix coverage audit provider identity matching'
          git push origin HEAD
