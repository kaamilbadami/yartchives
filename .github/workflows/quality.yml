name: Quality checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "analytics.js"
      - "app.js"
      - "frontend-utils.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "location-display.js"
      - "share.js"
      - "apply-next.js"
      - "apply-next-readiness.js"
      - "apply-next-competition.js"
      - "apply-next-location.js"
      - "apply-next-location-preferences.js"
      - "apply-next-location-profile-ui.js"
      - "apply-next-presentation.js"
      - "apply-next-ui.js"
      - "apply-next-profile-setup.js"
      - "apply-next-profile-setup.css"
      - "index.html"
      - "styles.css"
      - "location.css"
      - "ui.css"
      - "ux.css"
      - "scripts/**"
      - "tests/**"
      - "data/employer-seeds/**"
      - "employer_universe.json"
      - "data/workday-inspections.json"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "37 11 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether repository-health checks are relevant
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "health=true" >> "$GITHUB_OUTPUT"
          else
            bash scripts/quality_scope.sh "$PR_BASE_SHA" "$PR_HEAD_SHA" | tail -n 1 >> "$GITHUB_OUTPUT"
          fi

      - name: Python tests
        run: bash scripts/run_quality_checks.sh python

      - name: Frontend tests
        run: bash scripts/run_quality_checks.sh frontend

      - name: Repository health checks
        if: steps.scope.outputs.health == 'true'
        run: bash scripts/run_quality_checks.sh health

  live-source-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild from live sources
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          python scripts/build_feed.py
          python scripts/enrich_feed.py data/listings.json
          python scripts/repair_links.py data/listings.json
          python scripts/provider_links.py data/listings.json
          python scripts/jobright_links.py data/listings.json
          python scripts/source_links.py data/listings.json
          python scripts/reconcile_workday_duplicates.py data/listings.json
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8 --strict-sources
          python scripts/audit_feed.py data/listings.json

  wake-automerge:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.tests.result == 'success' &&
      needs.live-source-smoke.result == 'success'
    needs:
      - tests
      - live-source-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Wake auto-merge controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run auto-merge-agent-prs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f wait_for_quality_run_id="$GITHUB_RUN_ID"
