name: Quality checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "frontend-utils.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "location-display.js"
      - "share.js"
      - "apply-next.js"
      - "apply-next-readiness.js"
      - "apply-next-competition.js"
      - "apply-next-ui.js"
      - "index.html"
      - "styles.css"
      - "location.css"
      - "ui.css"
      - "ux.css"
      - "scripts/**"
      - "tests/**"
      - "data/workday-inspections.json"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "37 11 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python tests
        run: |
          python -m py_compile scripts/build_feed.py scripts/direct_ct_workday.py scripts/workday_inspector.py scripts/update_workday_inspections.py scripts/reconcile_workday_duplicates.py scripts/enrich_feed.py scripts/repair_links.py scripts/provider_links.py scripts/jobright_links.py scripts/source_links.py scripts/validate_feed.py scripts/audit_feed.py scripts/coverage_audit.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Frontend tests
        run: |
          node --check frontend-utils.js
          node --check app.js
          node --check enhancements.js
          node --check ui.js
          node --check ux.js
          node --check location-display.js
          node --check share.js
          node --check apply-next.js
          node --check apply-next-readiness.js
          node --check apply-next-competition.js
          node --check apply-next-ui.js
          node tests/frontend-utils.test.cjs
          node tests/location-display.test.cjs
          node tests/apply-next.test.cjs
          node tests/apply-next-readiness.test.cjs
          node tests/apply-next-competition.test.cjs
          node tests/apply-next-ui.test.cjs

      - name: Validate checked-in feed
        run: |
          python scripts/enrich_feed.py data/listings.json
          python scripts/repair_links.py data/listings.json --offline
          python scripts/reconcile_workday_duplicates.py data/listings.json
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8
          python scripts/audit_feed.py data/listings.json

  live-source-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild from live sources
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          python scripts/build_feed.py
          python scripts/enrich_feed.py data/listings.json
          python scripts/repair_links.py data/listings.json
          python scripts/provider_links.py data/listings.json
          python scripts/jobright_links.py data/listings.json
          python scripts/source_links.py data/listings.json
          python scripts/reconcile_workday_duplicates.py data/listings.json
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8 --strict-sources
          python scripts/audit_feed.py data/listings.json
