name: Quality checks
# Include the recovery PR identity in Actions run metadata for dispatch/run reconciliation.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_recovery == true && format('Recovery PR #{0} head {1} merge {2}', inputs.pr_number, inputs.pr_head_sha, inputs.pr_merge_sha) || 'Quality checks' }}

on:
  workflow_dispatch:
    inputs:
      pr_recovery:
        description: Run PR-equivalent checks after an automated branch refresh
        required: false
        default: false
        type: boolean
      pr_number:
        description: PR number whose current synthetic merge commit must pass required tests
        required: false
        default: ""
        type: string
      pr_head_sha:
        description: Immutable PR head SHA for read-only recovery when Copilot CI is approval-gated
        required: false
        default: ""
        type: string
      pr_merge_sha:
        description: Expected synthetic merge SHA for exactly pinned PR recovery
        required: false
        default: ""
        type: string
  pull_request:
  push:
    branches:
      - main
    paths:
      - "analytics.js"
      - "analytics/**"
      - "app.js"
      - "frontend-utils.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "location-display.js"
      - "share.js"
      - "apply-next.js"
      - "apply-next-readiness.js"
      - "apply-next-competition.js"
      - "apply-next-location.js"
      - "apply-next-location-preferences.js"
      - "apply-next-location-profile-ui.js"
      - "apply-next-presentation.js"
      - "apply-next-ui.js"
      - "apply-next-profile-setup.js"
      - "apply-next-profile-setup.css"
      - "index.html"
      - "styles.css"
      - "location.css"
      - "ui.css"
      - "ux.css"
      - "scripts/**"
      - "tests/**"
      - "data/employer-seeds/**"
      - "employer_universe.json"
      - "data/workday-inspections.json"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "37 11 * * *"

permissions:
  contents: read

# Recovery runs always execute trusted main, but target *different* PR/merge SHAs.
# A global quality-main cancellation group caused unrelated recoveries to cancel
# one another before they could publish the required merge check run.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_recovery == true && format('quality-recovery-{0}-{1}-{2}', inputs.pr_number, inputs.pr_head_sha, github.run_id) || format('quality-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pr_recovery == true) }}

jobs:
  targeted-frontend-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test targeted preflight planner
        run: python -m unittest tests.test_targeted_frontend_preflight -v

      - name: Run affected frontend checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/targeted_frontend_preflight.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

  tests:
    outputs:
      tested_merge_sha: ${{ steps.merge_target.outputs.merge_sha }}
    needs:
      - targeted-frontend-preflight
    if: >-
      always() &&
      (
        needs.targeted-frontend-preflight.result == 'success' ||
        needs.targeted-frontend-preflight.result == 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve and check out current PR merge commit without API credentials
        id: merge_target
        if: github.event_name == 'workflow_dispatch' && inputs.pr_recovery == true && inputs.pr_number != ''
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_MERGE_SHA: ${{ inputs.pr_merge_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MERGE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Missing expected merge identity"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number"; exit 1; }
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/merge"
          merge_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$merge_sha" == "$EXPECTED_MERGE_SHA" ]] || { echo "Synthetic merge changed before testing"; exit 1; }
          git checkout --detach "$merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether repository-health checks are relevant
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_RECOVERY: ${{ inputs.pr_recovery }}
          MERGE_SHA: ${{ steps.merge_target.outputs.merge_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PR_RECOVERY" = "true" ]; then
            bash scripts/quality_scope.sh "origin/main" "${MERGE_SHA:-$GITHUB_SHA}" | tail -n 1 >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "health=true" >> "$GITHUB_OUTPUT"
          else
            bash scripts/quality_scope.sh "$PR_BASE_SHA" "$PR_HEAD_SHA" | tail -n 1 >> "$GITHUB_OUTPUT"
          fi

      - name: Python tests
        run: bash scripts/run_quality_checks.sh python

      - name: Frontend tests
        run: bash scripts/run_quality_checks.sh frontend

      - name: Repository health checks
        if: steps.scope.outputs.health == 'true'
        run: bash scripts/run_quality_checks.sh health

  head-tests:
    # The untrusted Copilot head is executed ONLY in this read-only job.
    # No secrets, write-capable token, status publication, or deployment.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_recovery == true &&
      inputs.pr_number != '' &&
      inputs.pr_head_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested_head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Check out trusted workflow baseline without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Pin and check out exact untrusted PR head
        id: head
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          head_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$head_sha" == "$EXPECTED_HEAD_SHA" ]] || {
            echo "Copilot PR head moved before validation; refusing stale result."
            exit 1
          }
          git checkout --detach "$head_sha"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies without restoring a privileged cache
        run: pip install -r requirements.txt

      - name: Run exact-head Python and frontend tests
        run: |
          bash scripts/run_quality_checks.sh python
          bash scripts/run_quality_checks.sh frontend

      - name: Run exact-head targeted frontend preflight
        env:
          PR_BASE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          python -m unittest tests.test_targeted_frontend_preflight -v
          python scripts/targeted_frontend_preflight.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Decide repository-health scope
        id: scope
        env:
          PR_HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: bash scripts/quality_scope.sh origin/main "$PR_HEAD_SHA" | tail -n 1 >> "$GITHUB_OUTPUT"

      - name: Run relevant repository-health checks
        if: steps.scope.outputs.health == 'true'
        run: bash scripts/run_quality_checks.sh health

  publish-pr-recovery-status:
    # Privileged status publication never executes checked-out PR code.
    needs: [tests, head-tests]
    # Without always(), a skipped optional head job suppresses legacy
    # merge-only recovery even when tests passed.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_recovery == true &&
      needs.tests.result == 'success' &&
      (needs.head-tests.result == 'success' || needs.head-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      # The required tests context is pinned to GitHub Actions App 15368.
      # A legacy commit status alone cannot satisfy that app-owned check.
      checks: write
    steps:
      - name: Publish required tests status for PR recovery
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TESTED_MERGE_SHA: ${{ needs.tests.outputs.tested_merge_sha }}
          EXPECTED_MERGE_SHA: ${{ inputs.pr_merge_sha }}
          TESTED_HEAD_SHA: ${{ needs.head-tests.outputs.tested_head_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$EXPECTED_MERGE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$TESTED_MERGE_SHA" == "$EXPECTED_MERGE_SHA" ]] || exit 1
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            [[ "$(jq -r '.state' <<<"$current")" == "open" ]] || exit 1
            [[ "$(jq -r '.base.ref' <<<"$current")" == "main" ]] || exit 1
            if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
              [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
              [[ "$TESTED_HEAD_SHA" == "$EXPECTED_HEAD_SHA" ]] || exit 1
              [[ "$(jq -r '.head.sha' <<<"$current")" == "$TESTED_HEAD_SHA" ]] || {
                echo "PR head moved since exact-head tests ran; refusing status publication."
                exit 1
              }
            fi
            target="$(jq -r '.merge_commit_sha // empty' <<<"$current")"
            [[ -n "$TESTED_MERGE_SHA" && "$target" == "$TESTED_MERGE_SHA" ]] || {
              echo "PR merge SHA moved since tests ran; refusing stale status publication."
              exit 1
            }
          fi
          if [[ -n "$TESTED_HEAD_SHA" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TESTED_HEAD_SHA" \
              -f state=success \
              -f context=copilot-head-tests \
              -f "target_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f description="Read-only exact-head Copilot recovery tests passed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$target" \
            -f state=success \
            -f context=tests \
            -f description="PR recovery Quality checks passed"
          if [[ -n "$PR_NUMBER" ]]; then
            # Ruleset requires a check *run* from the GitHub Actions app,
            # not merely a commit status with the same name. This job has
            # the trusted GitHub Actions app token; no untrusted PR code runs
            # here and all check output is fixed text.
            latest="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            [[ "$(jq -r '.state' <<<"$latest")" == "open" ]] || exit 1
            [[ "$(jq -r '.base.ref' <<<"$latest")" == "main" ]] || exit 1
            [[ "$(jq -r '.merge_commit_sha // empty' <<<"$latest")" == "$target" ]] || exit 1
            if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
              [[ "$(jq -r '.head.sha' <<<"$latest")" == "$EXPECTED_HEAD_SHA" ]] || exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name=tests \
              -f "head_sha=$target" \
              -f status=completed \
              -f conclusion=success \
              -f "details_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f "external_id=quality-recovery-$GITHUB_RUN_ID-$PR_NUMBER" \
              -f "output[title]=Trusted merge recovery tests passed" \
              -f "output[summary]=Read-only tests completed on the verified current synthetic PR merge commit."
          fi

  live-source-smoke:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_recovery != true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild from live sources
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          cp data/listings.json /tmp/yartchives-old-listings.json
          python scripts/build_feed.py
          python scripts/enrich_feed.py data/listings.json
          python scripts/repair_links.py data/listings.json
          python scripts/provider_links.py data/listings.json
          python scripts/jobright_links.py data/listings.json
          python scripts/source_links.py data/listings.json
          python scripts/reconcile_workday_duplicates.py data/listings.json
          python scripts/stabilize_job_ids.py data/listings.json --old-feed /tmp/yartchives-old-listings.json
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8 --strict-sources
          python scripts/audit_feed.py data/listings.json

  wake-automerge:
    # Never wake the merge controller before the trusted publisher has
    # recorded the required status on the tested synthetic merge commit.
    # A failed/skipped publication must not cause another premature scan.
    permissions:
      actions: write
      contents: read
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.pr_recovery == true &&
      needs.tests.result == 'success' &&
      needs.publish-pr-recovery-status.result == 'success'
    needs:
      - tests
      - publish-pr-recovery-status
    runs-on: ubuntu-latest
    steps:
      - name: Wake auto-merge controller
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RECOVERY: ${{ inputs.pr_recovery }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PR_RECOVERY" != "true" ]; then
            echo "Not a PR-recovery dispatch; auto-merge wake not needed."
            exit 0
          fi
          gh workflow run auto-merge-agent-prs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f wait_for_quality_run_id="$GITHUB_RUN_ID"
