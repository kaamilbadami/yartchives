name: Update opportunity feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "audit/samples/**"
      - "data/employer-seeds/**"
      - "frontend-utils.js"
      - "app.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "share.js"
      - "apply-next.js"
      - "apply-next-readiness.js"
      - "apply-next-competition.js"
      - "apply-next-ui.js"
      - "apply-next-profile-setup.js"
      - "apply-next-profile-setup.css"
      - "ux.css"
      - "sources.json"
      - "direct_sources.json"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write
  actions: write

# Keep one refresh alive to guarantee eventual completion. While it runs, retain
# only the newest pending refresh so intermediate merges do not create a backlog.
concurrency:
  group: update-opportunity-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate code
        run: |
          python -m py_compile scripts/build_feed.py scripts/careers_resolver.py scripts/employer_resolution_lifecycle.py scripts/employer_resolution_queue.py scripts/direct_ct_workday.py scripts/direct_icims.py scripts/direct_greenhouse.py scripts/direct_oracle.py scripts/parallel_ats_collect.py scripts/discover_workday_sources.py scripts/posting_requirements.py scripts/workday_inspector.py scripts/icims_inspector.py scripts/greenhouse_inspector.py scripts/migrate_cached_requirements.py scripts/update_workday_inspections.py scripts/reconcile_workday_duplicates.py scripts/stabilize_job_ids.py scripts/enrich_feed.py scripts/repair_links.py scripts/provider_links.py scripts/jobright_links.py scripts/source_links.py scripts/validate_feed.py scripts/audit_feed.py scripts/coverage_audit.py scripts/coverage_contract.py scripts/source_contribution_audit.py scripts/employer_universe.py scripts/employer_seed_from_benchmark.py scripts/fortune_500_seed.py scripts/state_of_ats_seed.py scripts/refresh_employer_universe.py scripts/provider_fingerprint.py scripts/update_readme_status.py
          node --check frontend-utils.js
          node --check app.js
          node --check enhancements.js
          node --check ui.js
          node --check ux.js
          node --check share.js
          node --check apply-next.js
          node --check apply-next-readiness.js
          node --check apply-next-competition.js
          node --check apply-next-ui.js
          node --check apply-next-profile-setup.js

      - name: Refresh employer universe from deterministic seed catalogs
        run: python scripts/refresh_employer_universe.py employer_universe.json audit/samples/northeast-midatlantic-cs-2026-09-17.json --seed data/employer-seeds/fortune-500-2026.json --seed data/employer-seeds/state-of-ats-2026-verified-hosts.json

      - name: Refresh bounded employer careers resolutions
        run: python scripts/employer_resolution_lifecycle.py employer_universe.json --ttl-days 7 --employer-budget 20 --request-budget 120

      - name: Persist employer universe before long feed build
        run: |
          if git diff --quiet -- employer_universe.json; then
            echo "No employer-universe changes to persist."
            exit 0
          fi

          cp employer_universe.json /tmp/yartchives-generated-employer-universe.json
          START_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$START_SHA" != "$REMOTE_SHA" ]; then
            echo "main advanced before employer resolutions could be persisted."
            CHANGED="$(git diff --name-only "$START_SHA".."$REMOTE_SHA")"
            echo "$CHANGED"
            FEED_INPUT_CHANGES="$(echo "$CHANGED" | grep -E '^(scripts/|audit/samples/|data/employer-seeds/|sources\.json$|direct_sources\.json$|requirements\.txt$|\.github/workflows/update-feed\.yml$)' || true)"
            if [ -n "$FEED_INPUT_CHANGES" ]; then
              echo "Feed-producing inputs changed; leaving this build unpublished so the queued refresh can rebuild from current main."
              exit 0
            fi

            echo "Only unrelated files changed; rebasing employer-universe output onto current main."
            git reset --hard origin/main
            cp /tmp/yartchives-generated-employer-universe.json employer_universe.json
          fi

          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add employer_universe.json
          git commit -m "chore: persist employer resolutions"
          git push origin HEAD:main

      - name: Snapshot existing final feed
        run: cp data/listings.json /tmp/yartchives-old-listings.json

      - name: Build normalized feed
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/benchmark_feed_stages.py --record "collection" -- python scripts/build_feed.py

      - name: Discover resolved and feed-evidenced US Workday career sites
        run: python scripts/benchmark_feed_stages.py --record "collection" -- python scripts/discover_workday_sources.py data/listings.json --configured direct_sources.json --universe employer_universe.json --output /tmp/yartchives-direct-sources.json

      - name: Add ATS employer coverage in parallel
        run: |
          python scripts/parallel_ats_collect.py data/listings.json \
            --old-feed /tmp/yartchives-old-listings.json \
            --sources /tmp/yartchives-direct-sources.json \
            --universe employer_universe.json

      - name: Add student-level metadata
        run: python scripts/benchmark_feed_stages.py --record "enrichment" -- python scripts/enrich_feed.py data/listings.json

      - name: Repair and validate application links
        run: python scripts/benchmark_feed_stages.py --record "link repair" -- python scripts/repair_links.py data/listings.json --old-feed /tmp/yartchives-old-listings.json

      - name: Recover provider-specific application links
        run: python scripts/benchmark_feed_stages.py --record "link repair" -- python scripts/provider_links.py data/listings.json

      - name: Recover Jobright employer application links
        run: python scripts/benchmark_feed_stages.py --record "link repair" -- python scripts/jobright_links.py data/listings.json

      - name: Recover source-only application links
        run: python scripts/benchmark_feed_stages.py --record "link repair" -- python scripts/source_links.py data/listings.json

      - name: Reconcile duplicate Workday postings
        run: python scripts/benchmark_feed_stages.py --record "ATS reconciliation" -- python scripts/reconcile_workday_duplicates.py data/listings.json

      - name: Stabilize published job identities
        run: python scripts/benchmark_feed_stages.py --record "ATS reconciliation" -- python scripts/stabilize_job_ids.py data/listings.json --old-feed /tmp/yartchives-old-listings.json

      - name: Validate generated feed
        run: python scripts/benchmark_feed_stages.py --record "validation" -- python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8 --enforce-link-contract

      - name: Commit fast-path opportunity feed
        run: |
          cat << 'INNER_EOF' > /tmp/publication.sh
          GENERATED_PATHS="data/listings.json"
          if git diff --quiet -- $GENERATED_PATHS; then
            echo "No feed changes."
          else
            cp data/listings.json /tmp/yartchives-generated-listings.json
            START_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"

            SHOULD_COMMIT="true"
            if [ "$START_SHA" != "$REMOTE_SHA" ]; then
              echo "main advanced while this refresh was running."
              CHANGED="$(git diff --name-only "$START_SHA".."$REMOTE_SHA")"
              echo "$CHANGED"

              FEED_INPUT_CHANGES="$(echo "$CHANGED" | grep -E '^(scripts/|audit/samples/|data/employer-seeds/|sources\.json$|direct_sources\.json$|requirements\.txt$|\.github/workflows/update-feed\.yml$)' || true)"
              if [ -n "$FEED_INPUT_CHANGES" ]; then
                echo "Feed-producing inputs changed on main; leaving this generated result unpublished."
                echo "Queueing a replacement refresh from current main."
                gh workflow run update-feed.yml --ref main
                SHOULD_COMMIT="false"
              else
                echo "Only unrelated or generated files changed; publishing this completed feed onto current main."
                git reset --hard origin/main
                cp /tmp/yartchives-generated-listings.json data/listings.json
              fi
            fi

            if [ "$SHOULD_COMMIT" = "true" ]; then
              if git diff --quiet -- $GENERATED_PATHS; then
                echo "No generated changes after synchronizing with main."
              else
                git config user.name "yartchives-bot"
                git config user.email "actions@users.noreply.github.com"
                git add $GENERATED_PATHS
                git commit -m "chore: refresh opportunity feed"
                git push origin main
              fi
            fi
          fi
          INNER_EOF
          python scripts/benchmark_feed_stages.py --record "publication" -- bash -e /tmp/publication.sh

      - name: Print coverage audit
        run: python scripts/benchmark_feed_stages.py --record "audit" -- python scripts/audit_feed.py data/listings.json

      - name: Measure frozen Northeast / Mid-Atlantic benchmark
        run: |
          python scripts/coverage_audit.py audit/samples/northeast-midatlantic-cs-2026-09-17.json \
            --feed data/listings.json

      - name: Refresh generated README status
        run: python scripts/benchmark_feed_stages.py --record "audit" -- python scripts/update_readme_status.py

      - name: Commit slow-path enrichments and audits
        run: |
          cat << 'INNER_EOF' > /tmp/deployment.sh
          GENERATED_PATHS="README.md"
          if git diff --quiet -- $GENERATED_PATHS; then
            echo "No audit changes."
          else
            START_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"

            SHOULD_COMMIT="true"
            if [ "$START_SHA" != "$REMOTE_SHA" ]; then
              echo "main advanced while this refresh was running."
              CHANGED="$(git diff --name-only "$START_SHA".."$REMOTE_SHA")"
              echo "$CHANGED"

              FEED_INPUT_CHANGES="$(echo "$CHANGED" | grep -E '^(scripts/|audit/samples/|data/employer-seeds/|sources\.json$|direct_sources\.json$|requirements\.txt$|\.github/workflows/update-feed\.yml$)' || true)"
              if [ -n "$FEED_INPUT_CHANGES" ]; then
                echo "Feed-producing inputs changed on main; leaving this generated result unpublished."
                echo "The queued or scheduled refresh will rebuild from the newer feed inputs."
                SHOULD_COMMIT="false"
              else
                echo "Only unrelated or generated files changed; publishing this completed feed onto current main."
                git reset --hard origin/main
              fi
            fi

            if [ "$SHOULD_COMMIT" = "true" ]; then
              # Re-run audits on top of the rebased main
              python scripts/update_readme_status.py

              if git diff --quiet -- $GENERATED_PATHS; then
                echo "No generated changes after synchronizing with main."
              else
                git config user.name "yartchives-bot"
                git config user.email "actions@users.noreply.github.com"
                git add $GENERATED_PATHS
                git commit -m "chore: refresh feed audits"
                git push origin main
              fi
            fi
          fi
          INNER_EOF
          python scripts/benchmark_feed_stages.py --record "deployment" -- bash -e /tmp/deployment.sh

      - name: Persist pipeline metrics
        if: always()
        run: |
          python scripts/benchmark_feed_stages.py --finalize
          GENERATED_PATHS="data/pipeline-metrics.json"
          if git diff --quiet -- $GENERATED_PATHS; then
            echo "No metrics changes."
          else
            cp data/pipeline-metrics.json /tmp/yartchives-pipeline-metrics.json
            START_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            REMOTE_SHA="$(git rev-parse origin/main)"

            SHOULD_COMMIT="true"
            if [ "$START_SHA" != "$REMOTE_SHA" ]; then
              echo "main advanced while this refresh was running."
              CHANGED="$(git diff --name-only "$START_SHA".."$REMOTE_SHA")"
              echo "$CHANGED"

              FEED_INPUT_CHANGES="$(echo "$CHANGED" | grep -E '^(scripts/|audit/samples/|data/employer-seeds/|sources\.json$|direct_sources\.json$|requirements\.txt$|\.github/workflows/update-feed\.yml$)' || true)"
              if [ -n "$FEED_INPUT_CHANGES" ]; then
                echo "Feed-producing inputs changed on main; leaving this generated result unpublished."
                echo "The queued or scheduled refresh will rebuild from the newer feed inputs."
                SHOULD_COMMIT="false"
              else
                echo "Only unrelated or generated files changed; publishing this completed feed onto current main."
                git reset --hard origin/main
                cp /tmp/yartchives-pipeline-metrics.json data/pipeline-metrics.json
              fi
            fi

            if [ "$SHOULD_COMMIT" = "true" ]; then
              if git diff --quiet -- $GENERATED_PATHS; then
                echo "No generated changes after synchronizing with main."
              else
                git config user.name "yartchives-bot"
                git config user.email "actions@users.noreply.github.com"
                git add $GENERATED_PATHS
                git commit -m "chore: record pipeline metrics"
                git push origin main || true
              fi
            fi
          fi
