name: Update opportunity feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-opportunity-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair markdown table separator parser
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_feed.py")
          text = path.read_text(encoding="utf-8")
          old = 're.match(r"^\\s*\\|?\\s*:?-{v3}", next_line)'
          new = 're.match(r"^\\s*\\|?\\s*:?-{3,}", next_line)'
          if old not in text:
              raise SystemExit("Expected parser pattern not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile scripts/build_feed.py

      - name: Build normalized feed
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/build_feed.py

      - name: Commit parser repair and updated feed
        run: |
          if git diff --quiet -- scripts/build_feed.py data/listings.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_feed.py data/listings.json
          git commit -m "fix: parse markdown opportunity tables"
          git push
