name: Update opportunity feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-opportunity-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate feed builder
        run: python -m py_compile scripts/build_feed.py

      - name: Build normalized feed
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/listings.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          git commit -m "chore: refresh opportunity feed"
          git push
