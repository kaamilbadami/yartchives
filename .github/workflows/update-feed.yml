name: Update opportunity feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "frontend-utils.js"
      - "enhancements.js"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-opportunity-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate code
        run: |
          python -m py_compile scripts/build_feed.py scripts/enrich_feed.py scripts/validate_feed.py
          python -m unittest discover -s tests -p "test_*.py" -v
          node --check frontend-utils.js
          node --check app.js
          node --check enhancements.js
          node tests/frontend-utils.test.cjs

      - name: Build normalized feed
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/build_feed.py

      - name: Add student-level metadata
        run: python scripts/enrich_feed.py data/listings.json

      - name: Validate generated feed
        run: python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/listings.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json
          git commit -m "chore: refresh opportunity feed"
          git pull --rebase origin main
          git push origin main
