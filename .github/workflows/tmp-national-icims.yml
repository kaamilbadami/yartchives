name: Temporary national iCIMS validation

on:
  push:
    branches:
      - feat/national-icims-enumeration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply patch
        run: python tmp_patch_national_icims.py
      - name: Validate
        run: |
          python -m py_compile scripts/direct_icims.py scripts/enrich_feed.py
          python -m unittest tests.test_direct_icims -v
          python -m unittest discover -s tests -p "test_*.py" -v
          node tests/frontend-utils.test.cjs
          node tests/apply-next.test.cjs
          node tests/apply-next-readiness.test.cjs
          node tests/apply-next-competition.test.cjs
          node tests/apply-next-ui.test.cjs
          node tests/apply-next-profile-setup.test.cjs
          python scripts/validate_feed.py data/listings.json --minimum-jobs 500 --minimum-healthy-sources 8
          git diff --check
      - name: Commit validated code changes
        run: |
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- .github/workflows/update-feed.yml .github/workflows/quality.yml .github/workflows/tmp-national-icims.yml
          git rm tmp_patch_national_icims.py
          git add -A scripts tests tmp_patch_national_icims.py
          git commit -m "Generalize evidenced iCIMS sibling coverage nationally"
          git push origin HEAD
