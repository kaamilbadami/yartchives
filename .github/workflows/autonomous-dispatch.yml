name: Dispatch autonomous backlog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types:
      - closed
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - closed

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-backlog-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Guard against blind Jules redispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/guard_jules_redispatch.py

      - name: Dispatch safe non-overlapping work
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_POLL_SECONDS: "30"
          JULES_WATCH_SECONDS: "0"
        run: python scripts/dispatch_autonomous_issues.py
