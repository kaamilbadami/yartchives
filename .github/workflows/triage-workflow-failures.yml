name: Triage workflow failures

on:
  workflow_run:
    workflows:
      - Quality checks
      - Update opportunity feed
      - Feed freshness watchdog
      - Deploy Yartchives site
      - Dispatch autonomous backlog
      - Auto-merge autonomous agent PRs
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      # Trusted-main controller only. Never execute PR-head code with this token.
      # Explicit opt-in until a real Copilot response to bot-triggered repair is proven.
      - name: Request bounded Copilot repair for eligible failed PR CI
        if: github.event.workflow_run.name == 'Quality checks' && github.event.workflow_run.conclusion == 'failure' && vars.COPILOT_REPAIR_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          COPILOT_REPAIR_ENABLED: ${{ vars.COPILOT_REPAIR_ENABLED }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/repair_copilot_pr.py

      - name: Create, update, or resolve failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/triage_workflow_failures.py
