name: Cleanup regional benchmark artifacts

on:
  push:
    branches:
      - audit/regional-coverage-benchmark
    paths:
      - ".benchmark-cleanup"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Remove generated Python cache artifacts
        run: |
          rm -rf scripts/__pycache__ tests/__pycache__
          rm -f .benchmark-cleanup .github/workflows/cleanup-regional-benchmark.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove benchmark test cache artifacts"
          git push
