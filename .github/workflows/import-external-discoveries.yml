name: Import External Discoveries

on:
  workflow_dispatch:
    inputs:
      input_data:
        description: 'Raw JSON containing discoveries to import'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import-discoveries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write input data
        env:
          INPUT_DATA: ${{ inputs.input_data }}
        run: |
          echo "$INPUT_DATA" > /tmp/input.json

      - name: Process external discoveries
        run: |
          mkdir -p audit/drafts
          # Generate hash from input data to make workflow idempotent
          input_hash=$(sha256sum /tmp/input.json | awk '{print $1}' | cut -c 1-8)
          timestamp=$(date +%Y-%m-%d-%H-%M-%S)
          output_csv="audit/drafts/imported-discoveries-${timestamp}-${input_hash}.csv"
          python3 scripts/import_external_discoveries.py /tmp/input.json "$output_csv"
          echo "OUTPUT_CSV=$output_csv" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "audit: Import external discoveries"
          title: "audit: Import external discoveries"
          body: |
            Automated import of external discoveries from AI scheduled tasks.

            This PR adds a new draft CSV. Please review and process it using `external_discovery_benchmark.py` to freeze the benchmark before merging.
          branch: "automated/import-external-discoveries"
          base: "main"
          delete-branch: true
