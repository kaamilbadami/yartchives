name: Deploy Yartchives site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "location.css"
      - "ui.css"
      - "ux.css"
      - "frontend-utils.js"
      - "app.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "data/listings.json"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - "Update opportunity feed"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css location.css ui.css ux.css frontend-utils.js app.js enhancements.js ui.js ux.js .nojekyll _site/
          cp data/listings.json _site/data/listings.json
          VERSION="$(git rev-parse --short=12 HEAD)"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|href=\"location.css\"|href=\"location.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|href=\"ui.css\"|href=\"ui.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|href=\"ux.css\"|href=\"ux.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"frontend-utils.js\"|src=\"frontend-utils.js?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"enhancements.js\"|src=\"enhancements.js?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"ui.js\"|src=\"ui.js?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"ux.js\"|src=\"ux.js?v=${VERSION}\"|" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
