name: Deploy Yartchives site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "assets/**"
      - "scripts/build_apply_next_inspections.py"
      - "scripts/build_apply_next_candidates.py"
      - "scripts/build_geo_index.py"
      - "scripts/send_web_push.py"
      - "requirements-push.txt"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - Update opportunity feed
      - Refresh bounded inspections
    types:
      - completed
  repository_dispatch:
    types:
      - deploy_yartchives_site
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Hydrate latest runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download_latest_feed.py --repo "${{ github.repository }}"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site
          mkdir -p _site/data _site/assets
          cp index.html .nojekyll manifest.webmanifest _site/
          cp ./*.js ./*.css _site/
          cp -R assets/. _site/assets/
          cp data/listings.json _site/data/listings.json
          cp data/workday-inspections.json _site/data/workday-inspections.json
          python scripts/build_apply_next_inspections.py data/workday-inspections.json _site/data/apply-next-inspections.json
          python scripts/build_apply_next_candidates.py data/listings.json _site/data/apply-next-candidates.json
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/ReadyAPIs-com/curated-us-zips/f9eb7daabdade9b2a9f3cbc80327a5c152fc82d3/data/us-zips.csv" \
            -o /tmp/us-zips.csv
          python scripts/build_geo_index.py /tmp/us-zips.csv _site/data/geo-index.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("_site/data/geo-index.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not payload.get("zips") or not payload.get("cities"):
              raise SystemExit("geo-index.json is empty or malformed")
          PY
          BUILD_SHA="$(git rev-parse HEAD)"
          VERSION="$(git rev-parse --short=12 HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          INTERACTIVE_DEPLOY="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$BUILD_SHA/pulls" \
            --jq 'map(select((.head.ref // "") | startswith("agent/interactive/"))) | length > 0')"
          printf '{"build_sha":"%s","deployed_at":"%s","interactive":%s}\n' \
            "$BUILD_SHA" "$DEPLOYED_AT" "$INTERACTIVE_DEPLOY" \
            > _site/deployment-status.json
          sed -i "s|__YARTCHIVES_BUILD_SHA__|${BUILD_SHA}|g" _site/index.html
          sed -i "s|__YARTCHIVES_DEPLOYED_AT__|${DEPLOYED_AT}|g" _site/index.html
          for asset in ./*.css ./*.js; do
            name="$(basename "$asset")"
            sed -i "s|\"${name}\"|\"${name}?v=${VERSION}\"|g" _site/index.html
          done
          {
            printf 'build_sha=%s\n' "$BUILD_SHA"
            sha256sum _site/index.html
            for asset in _site/*.css _site/*.js; do
              sha256sum "$asset"
            done
          } > _site/deploy-manifest.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BUILD_SHA="$(git rev-parse HEAD)"
          VERSION="$(git rev-parse --short=12 HEAD)"
          BASE_URL="${PAGE_URL%/}"

          verified=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}/?verify=${BUILD_SHA}" \
              -o /tmp/live-index.html; then
              LIVE_SHA="$(sed -n 's/.*<meta name="yartchives-build" content="\([^"]*\)".*/\1/p' /tmp/live-index.html | head -n1)"
              if [ "$LIVE_SHA" = "$BUILD_SHA" ]; then
                verified=true
                break
              fi
            fi
            sleep 5
          done

          if [ "$verified" != true ]; then
            echo "::error::Live Pages site did not expose build SHA $BUILD_SHA after deployment."
            exit 1
          fi

          curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${BASE_URL}/deploy-manifest.txt?verify=${BUILD_SHA}" \
            -o /tmp/live-deploy-manifest.txt
          grep -Fx "build_sha=${BUILD_SHA}" /tmp/live-deploy-manifest.txt

          curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "${BASE_URL}/deployment-status.json?verify=${BUILD_SHA}" \
            -o /tmp/live-deployment-status.json
          python - "${BUILD_SHA}" <<'PY'
          import json
          import sys
          payload = json.load(open("/tmp/live-deployment-status.json", encoding="utf-8"))
          if payload.get("build_sha") != sys.argv[1]:
              raise SystemExit("deployment-status.json build SHA does not match live build")
          if not isinstance(payload.get("interactive"), bool):
              raise SystemExit("deployment-status.json interactive flag is not boolean")
          PY

          while read -r expected path; do
            [ -n "$expected" ] || continue
            name="$(basename "$path")"
            case "$name" in
              index.html)
                actual="$(sha256sum /tmp/live-index.html | awk '{print $1}')"
                ;;
              *.js|*.css)
                curl --fail --silent --show-error \
                  -H 'Cache-Control: no-cache' \
                  "${BASE_URL}/${name}?v=${VERSION}" \
                  -o "/tmp/live-${name}"
                actual="$(sha256sum "/tmp/live-${name}" | awk '{print $1}')"
                ;;
              *)
                continue
                ;;
            esac
            if [ "$actual" != "$expected" ]; then
              echo "::error::Live asset $name does not match the deployed artifact for $BUILD_SHA."
              exit 1
            fi
          done < <(tail -n +2 _site/deploy-manifest.txt)

          echo "Verified live Pages deployment for ${BUILD_SHA}."

      - name: Send successful deploy push
        env:
          GH_TOKEN: ${{ github.token }}
          YARTCHIVES_PUSH_SUBSCRIPTION: ${{ secrets.YARTCHIVES_PUSH_SUBSCRIPTION }}
          YARTCHIVES_VAPID_PRIVATE_KEY: ${{ secrets.YARTCHIVES_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD_SHA="$(git rev-parse HEAD)"
          if [ -z "${YARTCHIVES_PUSH_SUBSCRIPTION}" ] || [ -z "${YARTCHIVES_VAPID_PRIVATE_KEY}" ]; then
            echo "::error::Web Push secrets are not configured; a verified production deploy must not silently skip its notification."
            exit 1
          fi
          python -m pip install -r requirements-push.txt
          python scripts/send_web_push.py --build-sha "$BUILD_SHA"
          echo "Verified deploy notification sent for ${BUILD_SHA}."
