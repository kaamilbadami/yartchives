name: Deploy Yartchives site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "location.css"
      - "app.js"
      - "data/listings.json"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html styles.css location.css app.js .nojekyll _site/
          cp data/listings.json _site/data/listings.json
          VERSION="${GITHUB_SHA::12}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|href=\"location.css\"|href=\"location.css?v=${VERSION}\"|" _site/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${VERSION}\"|" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
