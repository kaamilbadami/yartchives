name: Deploy Yartchives site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "data/listings.json"
      - "data/workday-inspections.json"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp ./*.js ./*.css _site/
          cp data/listings.json _site/data/listings.json
          cp data/workday-inspections.json _site/data/workday-inspections.json
          VERSION="$(git rev-parse --short=12 HEAD)"
          for asset in ./*.css ./*.js; do
            name="$(basename "$asset")"
            sed -i "s|\"${name}\"|\"${name}?v=${VERSION}\"|g" _site/index.html
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
