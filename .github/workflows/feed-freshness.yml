name: Feed freshness watchdog

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hydrate production feed artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python scripts/download_latest_feed.py
          --repo "${{ github.repository }}"
          --require-feed-artifact

      - name: Check feed freshness
        id: freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watchdog_feed_freshness.py

      - name: Send stale-feed phone alert
        if: steps.freshness.outputs.alert_required == 'true'
        env:
          YARTCHIVES_PUSH_SUBSCRIPTION: ${{ secrets.YARTCHIVES_PUSH_SUBSCRIPTION }}
          YARTCHIVES_VAPID_PRIVATE_KEY: ${{ secrets.YARTCHIVES_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${YARTCHIVES_PUSH_SUBSCRIPTION}" ] || [ -z "${YARTCHIVES_VAPID_PRIVATE_KEY}" ]; then
            echo "::error::Web Push secrets are not configured; stale-feed phone alert cannot be delivered."
            exit 1
          fi
          python -m pip install -r requirements-push.txt
          AGE_SECONDS="${{ steps.freshness.outputs.feed_age_seconds }}"
          AGE_MINUTES="$((AGE_SECONDS / 60))"
          AGE_HOURS="$((AGE_MINUTES / 60))"
          AGE_REMAINDER="$((AGE_MINUTES % 60))"
          python scripts/send_web_push.py             --title "Yartchives feed is stale"             --body "Feed has not updated for ${AGE_HOURS}h ${AGE_REMAINDER}m. Automatic recovery has been triggered."             --tag "${{ steps.freshness.outputs.alert_tag }}"             --navigate "./"
