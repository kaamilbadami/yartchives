name: Branch preflight

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "analytics.js"
      - "app.js"
      - "frontend-utils.js"
      - "enhancements.js"
      - "ui.js"
      - "ux.js"
      - "location-display.js"
      - "share.js"
      - "apply-next.js"
      - "apply-next-readiness.js"
      - "apply-next-competition.js"
      - "apply-next-location.js"
      - "apply-next-location-preferences.js"
      - "apply-next-location-profile-ui.js"
      - "apply-next-presentation.js"
      - "apply-next-ui.js"
      - "apply-next-profile-setup.js"
      - "apply-next-profile-setup.css"
      - "index.html"
      - "styles.css"
      - "location.css"
      - "ui.css"
      - "ux.css"
      - "scripts/**"
      - "tests/**"
      - "data/employer-seeds/**"
      - "employer_universe.json"
      - "data/workday-inspections.json"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: branch-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full PR-equivalent validation
        run: bash scripts/run_quality_checks.sh all

      - name: Select repository-health scope
        id: scope
        run: |
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          bash scripts/quality_scope.sh "$base" HEAD | tail -n 1 >> "$GITHUB_OUTPUT"

      - name: Run relevant repository health checks
        if: steps.scope.outputs.health == 'true'
        run: bash scripts/run_quality_checks.sh health

  publish-pr:
    needs:
      - tests
    if: >-
      needs.tests.result == 'success' &&
      (startsWith(github.ref_name, 'agent/') || startsWith(github.ref_name, 'codex/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create trusted agent PR and dispatch authoritative CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists; leaving it unchanged."
            exit 0
          fi

          title="$(git log -1 --pretty=%s)"
          body="<!-- trusted-preflight-auto-pr -->
          Auto-created after targeted Branch preflight passed for \`$GITHUB_SHA\`.

          Full Quality checks are dispatched explicitly because PRs created by GITHUB_TOKEN do not recursively trigger pull_request workflows."

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "$title" \
            --body "$body"

          gh workflow run quality.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f pr_recovery=true

