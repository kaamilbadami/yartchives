name: Temporary regional benchmark after Greenhouse

on:
  push:
    branches:
      - audit/rerun-regional-benchmark-after-greenhouse
    paths:
      - ".github/workflows/rerun-regional-benchmark-after-greenhouse.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rerun regional benchmark and contract
        run: |
          set -euo pipefail
          cp audit/ct-ny-md-dc-cs-coverage-2026-09-17.json /tmp/old-regional.json
          python scripts/coverage_audit_runner.py audit/samples/ct-ny-md-dc-cs-2026-09-17.json \
            --output audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
            --markdown-output audit/ct-ny-md-dc-cs-coverage-2026-09-17.md
          python scripts/coverage_contract.py audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
            --json-output audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json \
            --markdown-output audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.md

      - name: Write benchmark delta note
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('/tmp/old-regional.json').read_text())
          new = json.loads(Path('audit/ct-ny-md-dc-cs-coverage-2026-09-17.json').read_text())
          def key(row):
              return (row.get('company'), row.get('title'), row.get('location'))
          old_by = {key(r): r for r in old.get('results', [])}
          changes = []
          for row in new.get('results', []):
              before = old_by.get(key(row))
              if before and before.get('status') != row.get('status'):
                  changes.append((row, before.get('status'), row.get('status')))
          os = old['summary']; ns = new['summary']
          lines = [
              '# Regional benchmark change note', '',
              f"Previous feed snapshot: `{old['feed']['generated_at']}`",
              f"Current feed snapshot: `{new['feed']['generated_at']}`", '',
              '## Benchmark delta', '',
              f"- Captured or probably captured: **{os['captured_or_probably_captured']}/{os['external_listings']} ({os['capture_rate']*100:.1f}%) → {ns['captured_or_probably_captured']}/{ns['external_listings']} ({ns['capture_rate']*100:.1f}%)**.",
              f"- Visible under expected filters: **{os['visible_under_expected_filters']}/{os['external_listings']} ({os['visible_rate']*100:.1f}%) → {ns['visible_under_expected_filters']}/{ns['external_listings']} ({ns['visible_rate']*100:.1f}%)**.",
              f"- Actionable findings: **{os['actionable_findings']} → {ns['actionable_findings']}**.",
              f"- Greenhouse true misses: **{os['missing_by_ats_family'].get('greenhouse', 0)} → {ns['missing_by_ats_family'].get('greenhouse', 0)}**.", '',
              '## Status changes', ''
          ]
          if changes:
              for row, before, after in changes:
                  lines.append(f"- **{row['company']} — {row['title']}** ({row['location']}): `{before}` → `{after}`.")
          else:
              lines.append('- No benchmark row changed status.')
          Path('audit/regional-benchmark-changes-2026-09-17.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate audit outputs
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v
          python - <<'PY'
          import json
          for path in [
              'audit/ct-ny-md-dc-cs-coverage-2026-09-17.json',
              'audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json',
          ]:
              json.load(open(path))
          PY
          git diff --check

      - name: Commit benchmark refresh and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/rerun-regional-benchmark-after-greenhouse.yml
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
                  audit/ct-ny-md-dc-cs-coverage-2026-09-17.md \
                  audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json \
                  audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.md \
                  audit/regional-benchmark-changes-2026-09-17.md \
                  .github/workflows/rerun-regional-benchmark-after-greenhouse.yml
          git commit -m "audit: refresh regional benchmark after Greenhouse expansion"
          git push origin HEAD:audit/rerun-regional-benchmark-after-greenhouse
