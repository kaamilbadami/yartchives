name: Temporary regional benchmark rerun

on:
  push:
    branches:
      - audit/rerun-regional-benchmark-after-speedyapply-ai

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rerun regional benchmark and contract
        run: |
          set -euo pipefail
          cp audit/ct-ny-md-dc-cs-coverage-2026-09-17.json /tmp/old-regional.json
          python scripts/coverage_audit_runner.py audit/samples/ct-ny-md-dc-cs-2026-09-17.json \
            --output audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
            --markdown-output audit/ct-ny-md-dc-cs-coverage-2026-09-17.md
          python scripts/coverage_contract.py audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
            --json-output audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json \
            --markdown-output audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.md

      - name: Write benchmark delta note
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('/tmp/old-regional.json').read_text())
          new = json.loads(Path('audit/ct-ny-md-dc-cs-coverage-2026-09-17.json').read_text())
          feed = json.loads(Path('data/listings.json').read_text())

          def key(row):
              return (row.get('company'), row.get('title'), row.get('location'))

          old_by = {key(r): r for r in old.get('results', [])}
          changes = []
          for row in new.get('results', []):
              before = old_by.get(key(row))
              if before and before.get('status') != row.get('status'):
                  changes.append((row, before.get('status'), row.get('status')))

          cs_speedy = []
          speedy_unique = []
          for job in feed.get('jobs', []):
              source_keys = job.get('source_keys') or []
              profiles = job.get('profiles') or []
              if 'speedyapply-ai' in source_keys and 'cs' in profiles:
                  cs_speedy.append(job)
                  if len(source_keys) == 1:
                      speedy_unique.append(job)

          os = old['summary']; ns = new['summary']
          lines = [
              '# Regional benchmark change note', '',
              f"Previous feed snapshot: `{old['feed']['generated_at']}`",
              f"Current feed snapshot: `{new['feed']['generated_at']}`", '',
              '## Benchmark delta', '',
              f"- Captured or probably captured: **{os['captured_or_probably_captured']}/{os['external_listings']} ({os['capture_rate']*100:.1f}%) → {ns['captured_or_probably_captured']}/{ns['external_listings']} ({ns['capture_rate']*100:.1f}%)**.",
              f"- Visible under expected filters: **{os['visible_under_expected_filters']}/{os['external_listings']} ({os['visible_rate']*100:.1f}%) → {ns['visible_under_expected_filters']}/{ns['external_listings']} ({ns['visible_rate']*100:.1f}%)**.",
              f"- Actionable findings: **{os['actionable_findings']} → {ns['actionable_findings']}**.",
              f"- Production SpeedyApply AI/ML source contribution in the refreshed feed: **{len(cs_speedy)} CS rows**, including **{len(speedy_unique)} rows unique to that source**.", '',
              '## Status changes', ''
          ]
          if changes:
              for row, before, after in changes:
                  lines.append(f"- **{row['company']} — {row['title']}** ({row['location']}): `{before}` → `{after}`.")
                  match = row.get('matched_job') or {}
                  if match:
                      lines.append(f"  - Refreshed match: {match.get('location')}; profiles={','.join(match.get('profiles') or [])}; states={','.join(match.get('states') or [])}.")
          else:
              lines.append('- No benchmark row changed status.')
          lines += ['', '## Interpretation', '',
              '- The new SpeedyApply AI/ML source materially expands the production CS union, but this 106-role benchmark does **not** show a capture-rate increase yet.',
              '- The one visible-recall improvement comes from refreshed metadata/classification on an already captured Datadog posting, not from a newly captured benchmark role.',
              '- The benchmark therefore still points to source/role coverage as the primary bottleneck rather than profile visibility.', ''
          ]
          Path('audit/regional-benchmark-changes-2026-09-17.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Validate audit outputs
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v
          python - <<'PY'
          import json
          for path in [
              'audit/ct-ny-md-dc-cs-coverage-2026-09-17.json',
              'audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json',
          ]:
              json.load(open(path))
          PY
          git diff --check

      - name: Commit benchmark refresh and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/rerun-regional-benchmark-temp.yml
          git config user.name "yartchives-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/ct-ny-md-dc-cs-coverage-2026-09-17.json \
                  audit/ct-ny-md-dc-cs-coverage-2026-09-17.md \
                  audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.json \
                  audit/coverage-contract-status-ct-ny-md-dc-2026-09-17.md \
                  audit/regional-benchmark-changes-2026-09-17.md \
                  .github/workflows/rerun-regional-benchmark-temp.yml
          git commit -m "audit: refresh regional coverage benchmark"
          git push origin HEAD:audit/rerun-regional-benchmark-after-speedyapply-ai
