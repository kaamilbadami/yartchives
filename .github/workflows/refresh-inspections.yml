name: Refresh bounded inspections

on:
  workflow_dispatch:
  schedule:
    # Run slightly offset from the top of the hour to avoid contention
    - cron: "45 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-inspections-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-inspections:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hydrate latest runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download_latest_feed.py --repo "${{ github.repository }}"

      - name: Migrate cached requirement semantics
        run: python scripts/migrate_cached_requirements.py data/workday-inspections.json

      - name: Refresh bounded posting inspections
        run: python scripts/update_workday_inspections.py data/listings.json --cache data/workday-inspections.json --max-workday-requests 25 --max-icims-requests 10 --max-greenhouse-requests 10 --ttl-days 7

      - name: Publish bounded inspections artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yartchives-inspections
          path: data/workday-inspections.json
          if-no-files-found: error
          retention-days: 30
