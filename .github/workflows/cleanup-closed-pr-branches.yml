name: Clean up closed PR branches

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-closed-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete unused closed PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          open_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/pulls?state=open&head=$HEAD_OWNER:$HEAD_REF&per_page=1" \
              --jq 'length'
          )"

          if [[ "$open_count" != "0" ]]; then
            echo "Keeping $HEAD_REF because it is still used by an open pull request."
            exit 0
          fi

          if ! gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/git/refs/heads/$HEAD_REF"; then
            echo "Branch $HEAD_REF was already deleted or could not be removed."
          fi
