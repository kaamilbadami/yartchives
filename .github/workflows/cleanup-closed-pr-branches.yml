name: Clean up stale PR branches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  reconcile-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile safe stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          owner="${REPOSITORY%%/*}"

          mapfile -t open_heads < <(
            gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == "'"$REPOSITORY"'") | .head.ref'
          )

          is_open_head() {
            local candidate="$1"
            local head
            for head in "${open_heads[@]:-}"; do
              if [[ "$candidate" == "$head" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          kept=0

          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" ]] && continue

            if [[ "$branch" == "$default_branch" ]]; then
              continue
            fi

            if is_open_head "$branch"; then
              echo "Keeping $branch: used by an open pull request."
              kept=$((kept + 1))
              continue
            fi

            compare_json="$(gh api "repos/$REPOSITORY/compare/$default_branch...$branch")"
            ahead_by="$(jq -r '.ahead_by // 0' <<<"$compare_json")"

            safe_reason=""
            if [[ "$ahead_by" == "0" ]]; then
              safe_reason="branch has no commits ahead of $default_branch"
            else
              latest_closed="$(
                gh api "repos/$REPOSITORY/pulls?state=closed&head=$owner:$branch&sort=updated&direction=desc&per_page=1"
              )"
              closed_count="$(jq 'length' <<<"$latest_closed")"
              closed_head_sha="$(jq -r '.[0].head.sha // empty' <<<"$latest_closed")"

              if [[ "$closed_count" != "0" && "$closed_head_sha" == "$sha" ]]; then
                safe_reason="current tip belongs to a closed pull request"
              fi
            fi

            if [[ -z "$safe_reason" ]]; then
              echo "Keeping $branch: not provably stale."
              kept=$((kept + 1))
              continue
            fi

            echo "Deleting $branch: $safe_reason."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "repos/$REPOSITORY/branches?per_page=100" \
              --jq '.[] | [.name, .commit.sha] | @tsv'
          )

          echo "Deleted $deleted stale branches; kept $kept non-default branches."
