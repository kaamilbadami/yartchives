name: Deploy analytics backend

on:
  push:
    branches:
      - main
    paths:
      - "analytics/**"
      - ".github/workflows/deploy-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yartchives-analytics-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d5c243d8b9128fee958b70479a1 # v4
        with:
          node-version: "22"

      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Analytics backend deployment is disabled until CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are configured."
          fi

      - name: Provision D1 database
        if: steps.cloudflare.outputs.configured == 'true'
        id: d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.143.0"
          list_json="$($WRANGLER d1 list --json)"
          database_id="$(printf '%s' "$list_json" | python -c '
          import json, sys
          rows = json.load(sys.stdin)
          print(next((row.get("uuid") or row.get("id") or "" for row in rows if row.get("name") == "yartchives-analytics"), ""))
          ')"

          if [ -z "$database_id" ]; then
            echo "Creating yartchives-analytics D1 database."
            create_output="$($WRANGLER d1 create yartchives-analytics --location enam 2>&1)"
            printf '%s\\n' "$create_output"
            database_id="$(printf '%s' "$create_output" | python -c '
          import re, sys
          text = sys.stdin.read()
          match = re.search(r"[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}", text, re.I)
          print(match.group(0) if match else "")
          ')"
          fi

          if [ -z "$database_id" ]; then
            echo "::error::Could not resolve the D1 database ID."
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate deploy configuration
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path("analytics/wrangler.template.jsonc")
          target = Path("analytics/wrangler.generated.jsonc")
          text = source.read_text(encoding="utf-8")
          placeholder = "__YARTCHIVES_ANALYTICS_D1_DATABASE_ID__"
          database_id = os.environ["DATABASE_ID"].strip()
          if not database_id:
              raise SystemExit("DATABASE_ID is empty")
          if text.count(placeholder) != 1:
              raise SystemExit("Unexpected D1 database placeholder count")
          target.write_text(text.replace(placeholder, database_id), encoding="utf-8")
          PY

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          npx --yes wrangler@4.143.0 d1 migrations apply yartchives-analytics
          --remote
          --config analytics/wrangler.generated.jsonc

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.143.0 deploy --config analytics/wrangler.generated.jsonc 2>&1)"
          printf '%s\\n' "$output"
          worker_url="$(printf '%s' "$output" | python -c '
          import re, sys
          text = sys.stdin.read()
          urls = re.findall(r"https://[a-z0-9.-]+.workers.dev", text, re.I)
          print(urls[-1] if urls else "")
          ')"
          if [ -z "$worker_url" ]; then
            echo "::error::Worker deployed but workers.dev URL could not be parsed."
            exit 1
          fi
          endpoint="${worker_url%/}/collect"
          printf '%s\\n' "$endpoint" > analytics-endpoint.txt
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "### Analytics backend" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Receiver: `$endpoint`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: `${worker_url%/}/health`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed health endpoint
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          set -euo pipefail
          health="${ENDPOINT%/collect}/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$health" > /tmp/analytics-health.json
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/analytics-health.json", encoding="utf-8"))
          if payload != {"ok": True, "schema": "yartchives-usage-v2"}:
              raise SystemExit(f"Unexpected analytics health response: {payload!r}")
          PY

      - name: Publish receiver endpoint artifact
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yartchives-analytics-endpoint
          path: analytics-endpoint.txt
          retention-days: 30
          if-no-files-found: error
