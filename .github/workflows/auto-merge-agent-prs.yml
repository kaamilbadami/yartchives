name: Auto-merge autonomous agent PRs

on:
  workflow_dispatch:
    inputs:
      wait_for_quality_run_id:
        description: Quality workflow run that must finish before scanning
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"
  issue_comment:
    types:
      - created
      - edited
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autonomous-agent-pr-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'action_required'
      ) &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.comment.body, '<!-- owner-authorized-automerge -->')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for dispatched Quality run
        if: ${{ inputs.wait_for_quality_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "${{ inputs.wait_for_quality_run_id }}" \
            --repo "${{ github.repository }}" \
            --exit-status

      - name: Capture main before merge
        id: main_before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge one safe autonomous pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/auto_merge_agent_prs.py

      - name: Deploy site if auto-merge changed frontend
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ steps.main_before.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
            echo "main did not advance; no Pages deploy needed."
            exit 0
          fi

          changed_paths="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          if printf '%s\n' "$changed_paths" | grep -Eq '^(index\.html|[^/]+\.(js|css)|assets/|data/listings\.json$|data/workday-inspections\.json$|scripts/build_apply_next_inspections\.py$|\.nojekyll$|\.github/workflows/deploy-pages\.yml$)'; then
            echo "Auto-merge changed deploy-relevant files; dispatching Pages from resulting main."
            gh workflow run deploy-pages.yml --repo "$REPOSITORY" --ref main
          else
            echo "Auto-merge changed only non-site files; no Pages deploy needed."
          fi
