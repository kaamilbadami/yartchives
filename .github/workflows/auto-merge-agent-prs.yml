name: Auto-merge autonomous agent PRs

on:
  workflow_dispatch:
    inputs:
      wait_for_quality_run_id:
        description: Quality workflow run that must finish before scanning
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"
  issue_comment:
    types:
      - created
      - edited
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autonomous-agent-pr-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'action_required'
      ) &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          github.event.comment.user.login == github.repository_owner &&
          contains(github.event.comment.body, '<!-- owner-authorized-automerge -->')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for dispatched Quality run
        if: ${{ inputs.wait_for_quality_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "${{ inputs.wait_for_quality_run_id }}" \
            --repo "${{ github.repository }}" \
            --exit-status

      - name: Merge one safe autonomous pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/auto_merge_agent_prs.py
